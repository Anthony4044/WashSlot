# [T.1.2.4] Every PR runs ruff + pytest (backend) and npm run build (frontend).
# [T.1.3.4] The backend job also validates contract/openapi.yaml (and tests/test_contract.py checks our rules).
# Database tests skip when TEST_DATABASE_URL is unset; domain/service tests still run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # [T.1.3.4] The authored contract must be valid OpenAPI 3.1 before anything is tested against it.
      - name: Validate contract
        run: openapi-spec-validator ../contract/openapi.yaml

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  # [T.8.3.2] Start the real API on an empty Postgres and judge it by the contract: today's suite, and the
  # frozen v1.0 suite (an old client) that must keep passing. Plain `pytest` above skips both.
  conformance:
    name: Conformance (current + v1.0)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: washslot
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/washslot
      CONFORMANCE_BASE_URL: http://localhost:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Database, keys and seed data
        run: |
          python scripts/generate_keys.py
          alembic upgrade head
          python scripts/seed_users.py
          python scripts/seed_laundromats.py

      - name: Start the API
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/laundromats > /dev/null && exit 0; sleep 1; done
          exit 1

      - name: Conformance suite (current contract)
        run: pytest tests/conformance

      - name: Conformance suite v1.0 (frozen, must still pass)
        run: pytest tests/conformance_v1_0

  # [T.8.4.2] Start the stack with Docker Compose, book a slot, delete and recreate every container, and
  # check the booking is still there. compose.ci.yaml swaps Neon for a Postgres container with a named
  # volume, so the database's own container restarts too. The front end isn't needed, so it isn't built.
  restart-check:
    name: Restart check (Docker Compose)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Settings (the example file; compose.ci.yaml points DATABASE_URL at the Postgres container)
        run: cp backend/.env.example backend/.env

      - name: Start Postgres, the API and the worker
        run: docker compose up --detach --build api worker

      - name: Seed demo data
        run: |
          docker compose exec -T api python scripts/seed_users.py
          docker compose exec -T api python scripts/seed_laundromats.py

      - name: Restart check
        run: python3 scripts/restart_check.py api worker

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
