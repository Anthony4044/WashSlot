[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Our alembic/ folder holds migrations; the alembic package itself is third-party.
known-third-party = ["alembic"]
known-first-party = ["app"]
