upstream washslot_api {
    zone washslot_api 64k;
    resolver 127.0.0.11 valid=10s;
    server api:8000 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://washslot_api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
